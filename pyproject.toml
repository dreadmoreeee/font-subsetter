[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "font-subsetter"
version = "1.0.0"
description = "Subset web fonts to the characters your pages use (rendered in headless Chromium), write WOFF2 and matching @font-face CSS with unicode-range."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marvin Palencia" }]
keywords = ["web fonts", "subsetting", "woff2", "unicode-range", "font-face", "fonttools", "performance"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Fonts",
]
dependencies = ["fonttools>=4.40", "playwright>=1.40"]

[project.optional-dependencies]
woff2 = ["brotli>=1.0"]
test = ["pytest>=7"]

[project.scripts]
font-subsetter = "font_subsetter.cli:main"

[project.urls]
Homepage = "https://github.com/dreadmoreeee/font-subsetter"
Author = "https://marvin.demarkstudio.ca"

[tool.setuptools]
packages = ["font_subsetter"]

[tool.setuptools.package-data]
font_subsetter = ["collect.js"]
